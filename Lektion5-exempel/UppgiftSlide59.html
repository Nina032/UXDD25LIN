<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Övning</title>
</head>
<body>
<!-- 1. Visa en bild som länkar till en valfri webbplats.  -->
<a target="_blank" href="https://www.freepik.com/vectors/merry-christmas"><img src="images/37_christmas_01.jpg" alt="merry-christmas" width="33%" height="33%"></a>
<hr>
<!-- 2. Placera en valfri bild i en figure-tagg och lägg till en figcaption.  -->
<figure>
    <img src="https://picsum.photos/id/24/485/250"alt="A book">
    <br>
    <figcaption>
        <q>Books are a uniquely portable magic.</q> – Stephen King
    </figcaption>
</figure>
<hr>
<!-- 3. Skapa följande tabell.  -->

<table border="1" width="50%" align="center">
    <caption>Mina studier</caption>
    <tr>
        <th></th>
        <th>9am</th>
        <th>10am</th>
        <th>11am</th>
        <th>12am</th>
    </tr>
    <tr>
        <th scope="row">Monday</th>
        <td colspan="2" align="center">Geography</td>
        <td>Math</td>
        <td>Art</td>
    </tr>
    <tr>
        <th scope="row">Tuesday</th>
        <td colspan="3">Gym</td>
        <td>Home Ec</td>
    </tr>
</table>

</body>
</html>
